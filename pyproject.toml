[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dbskiter"
dynamic = ["version", "readme"]
description = "数据库 Skills 集合 - 监控、诊断、安全、调度、SQL执行"
authors = [
    {name = "MagiCzc", email = "magiczc@139.com"},
]
license = {text = "MIT"}
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
keywords = ["database", "mysql", "oracle", "postgresql", "clickhouse", "sqlite", "dba", "aiops"]

dependencies = [
    "sqlalchemy>=2.0.0",
    "pymysql>=1.0.0",
    "psycopg2-binary>=2.9.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.0.0",
    "numpy>=1.21.0",
    "requests>=2.28.0",
    "jinja2>=3.0.0",
    "pydantic>=2.0.0",
    "sqlparse>=0.5.0",
    "rich>=13.0.0",
    "pyyaml>=5.0",
    "argcomplete>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "hypothesis>=6.100.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "flake8-bugbear>=24.0.0",
    "mypy>=1.0.0",
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.0.0",
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=2.0.0",
    "sphinx-autodoc-typehints>=2.0.0",
    "myst-parser>=3.0.0",
]
oracle = [
    "oracledb>=1.4.0",
    "JayDeBeApi>=1.2.0",
]
report = [
    "weasyprint>=59.0",
]
web = [
    "uvicorn>=0.27.0",
    "fastapi>=0.109.0",
    "pyjwt>=2.8.0",
    "werkzeug>=3.0.0",
    "apscheduler>=3.10.0",
]

[project.scripts]
dbskiter = "dbskiter.cli.main:main"
dbcli = "dbskiter.cli.main:main"

[project.urls]
Homepage = "https://github.com/magicCzc/dbskiter"
Repository = "https://github.com/magicCzc/dbskiter.git"
Issues = "https://github.com/magicCzc/dbskiter/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["dbskiter*"]

[tool.setuptools.dynamic]
version = {attr = "dbskiter.__version__"}
readme = {file = "README.md", content-type = "text/markdown"}

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
strict_optional = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = false
warn_redundant_casts = true
warn_unused_ignores = true

[tool.black]
line-length = 120
target-version = ["py38", "py39", "py310", "py311", "py312"]

[[tool.mypy.overrides]]
module = [
    "pymysql.*",
    "psycopg2.*",
    "pandas.*",
    "numpy.*",
    "sqlalchemy.*",
    "jinja2.*",
    "pydantic.*",
    "sqlparse.*",
    "dotenv.*",
    "argcomplete.*",
    "oracledb.*",
    "JayDeBeApi.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning:dbskiter.db_security.*:",
]

[tool.coverage.run]
source = ["dbskiter"]
omit = ["*/tests/*", "*__init__.py*", "*__main__.py*", "*setup.py*", "*conftest.py*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
fail_under = 15
