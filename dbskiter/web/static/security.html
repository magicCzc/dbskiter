<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安全审计 - DBSKiter</title>
    <link rel="stylesheet" href="/ui/css/style.css">
</head>
<body>
    <nav>
        <a href="/ui/" class="logo">DBSKiter</a>
        <a href="/ui/">仪表盘</a>
        <a href="/ui/slow-queries.html">慢查询</a>
        <a href="/ui/security.html" class="active">安全审计</a>
        <a href="/ui/backup.html">备份管理</a>
        <a href="/ui/scheduler.html">任务调度</a>
    </nav>

    <div class="container">
        <div id="error" class="error"></div>
        <div id="loading" class="loading">加载中...</div>

        <div class="card">
            <h2>🔒 安全审计</h2>
            <div class="toolbar">
                <label>数据库：</label>
                <input type="text" id="db-input" value="default" style="max-width:200px;">
                <button class="btn-primary" onclick="runSecurityAudit()">执行审计</button>
            </div>
        </div>

        <div class="metrics-grid" id="summary">
            <div class="metric-card"><div class="value" id="total-risks">-</div><div class="label">风险总数</div></div>
            <div class="metric-card"><div class="value" id="critical-count">-</div><div class="label">严重风险</div></div>
            <div class="metric-card"><div class="value" id="high-count">-</div><div class="label">高风险</div></div>
            <div class="metric-card"><div class="value" id="risk-score">-</div><div class="label">安全评分</div></div>
        </div>

        <div class="card">
            <h2>风险列表</h2>
            <table>
                <thead>
                    <tr><th>级别</th><th>描述</th><th>分类</th><th>当前值</th><th>建议值</th></tr>
                </thead>
                <tbody id="risks-table"></tbody>
            </table>
        </div>
    </div>

    <footer>DBSKiter v3.0.43 &middot; 数据库 AIOps 运维助手</footer>

    <script>
        async function runSecurityAudit() {
            const db = document.getElementById('db-input').value || 'default';
            showLoading(true);
            document.getElementById('error').classList.remove('show');

            try {
                const data = await apiFetch(`/security?database=${encodeURIComponent(db)}`);
                const risks = data.risks || [];

                // 汇总
                document.getElementById('total-risks').textContent = data.total_risks || 0;
                document.getElementById('critical-count').textContent = data.critical_count || 0;
                document.getElementById('high-count').textContent = data.high_count || 0;

                // 安全评分（从风险等级估算）
                const score = Math.max(0, 100 - (data.critical_count || 0) * 20 - (data.high_count || 0) * 10 - risks.length * 2);
                document.getElementById('risk-score').textContent = Math.max(0, score);

                // 表格
                const tbody = document.getElementById('risks-table');
                if (risks.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#64748b;">未发现安全风险</td></tr>';
                    return;
                }

                tbody.innerHTML = risks.map(r => {
                    const level = r.severity || r.level || 'medium';
                    const badgeClass = 'badge-' + (['critical', 'high', 'medium', 'low'].includes(level) ? level : 'medium');
                    return `<tr>
                        <td><span class="badge ${badgeClass}">${level}</span></td>
                        <td>${escapeHtml(r.description || '-')}</td>
                        <td>${escapeHtml(r.category || '-')}</td>
                        <td><code style="font-size:12px;">${escapeHtml(r.current_value || '-')}</code></td>
                        <td><code style="font-size:12px;">${escapeHtml(r.recommended_value || '-')}</code></td>
                    </tr>`;
                }).join('');

            } catch (err) {
                showError(err.message);
            } finally {
                showLoading(false);
            }
        }

        document.addEventListener('DOMContentLoaded', runSecurityAudit);
    </script>
</body>
</html>
