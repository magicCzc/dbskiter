<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>慢查询分析 - DBSKiter</title>
    <link rel="stylesheet" href="/ui/css/style.css">
</head>
<body>
    <nav>
        <a href="/ui/" class="logo">DBSKiter</a>
        <a href="/ui/">仪表盘</a>
        <a href="/ui/slow-queries.html" class="active">慢查询</a>
        <a href="/ui/security.html">安全审计</a>
        <a href="/ui/backup.html">备份管理</a>
        <a href="/ui/scheduler.html">任务调度</a>
    </nav>

    <div class="container">
        <div id="error" class="error"></div>
        <div id="loading" class="loading">加载中...</div>

        <div class="card">
            <h2>🐢 慢查询分析</h2>
            <div class="toolbar">
                <label>数据库：</label>
                <input type="text" id="db-input" value="default" style="max-width:200px;">
                <label>数量：</label>
                <select id="top-select">
                    <option value="5">Top 5</option>
                    <option value="10" selected>Top 10</option>
                    <option value="20">Top 20</option>
                    <option value="50">Top 50</option>
                </select>
                <label>时间范围：</label>
                <select id="hours-select">
                    <option value="1">1 小时</option>
                    <option value="6" selected>6 小时</option>
                    <option value="24">24 小时</option>
                    <option value="72">3 天</option>
                </select>
                <button class="btn-primary" onclick="loadSlowQueries()">查询</button>
            </div>
        </div>

        <div class="metrics-grid" id="summary">
            <div class="metric-card"><div class="value" id="total-count">-</div><div class="label">慢查询总数</div></div>
            <div class="metric-card"><div class="value" id="max-time">-</div><div class="label">最慢耗时</div></div>
            <div class="metric-card"><div class="value" id="avg-time">-</div><div class="label">平均耗时</div></div>
            <div class="metric-card"><div class="value" id="total-rows">-</div><div class="label">总扫描行数</div></div>
        </div>

        <div class="card">
            <h2>慢查询列表</h2>
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>SQL</th>
                        <th>总耗时</th>
                        <th>执行次数</th>
                        <th>平均耗时</th>
                        <th>扫描行数</th>
                    </tr>
                </thead>
                <tbody id="queries-table"></tbody>
            </table>
        </div>
    </div>

    <footer>DBSKiter v3.0.43 &middot; 数据库 AIOps 运维助手</footer>

    <script>
        async function loadSlowQueries() {
            const db = document.getElementById('db-input').value || 'default';
            const top = document.getElementById('top-select').value;
            const hours = document.getElementById('hours-select').value;
            showLoading(true);
            document.getElementById('error').classList.remove('show');

            try {
                const data = await apiFetch(
                    `/slow-queries?database=${encodeURIComponent(db)}&top=${top}&hours=${hours}`
                );
                const queries = data.queries || [];
                const tbody = document.getElementById('queries-table');

                // 汇总
                document.getElementById('total-count').textContent = data.total || 0;
                const maxTime = queries.length ? Math.max(...queries.map(q => q.execution_time || 0)) : 0;
                document.getElementById('max-time').textContent = maxTime ? `${maxTime.toFixed(2)}s` : '-';
                const avgTime = queries.length
                    ? queries.reduce((s, q) => s + (q.execution_time || 0), 0) / queries.length
                    : 0;
                document.getElementById('avg-time').textContent = avgTime ? `${avgTime.toFixed(2)}s` : '-';
                const totalRows = queries.reduce((s, q) => s + (q.rows_examined || 0), 0);
                document.getElementById('total-rows').textContent = totalRows.toLocaleString();

                // 表格
                if (queries.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#64748b;">暂无慢查询数据</td></tr>';
                    return;
                }

                tbody.innerHTML = queries.map((q, i) => {
                    const sql = (q.sql || '').length > 80 ? q.sql.substring(0, 80) + '...' : (q.sql || '-');
                    return `<tr>
                        <td>${i + 1}</td>
                        <td><code style="font-size:12px;">${escapeHtml(sql)}</code></td>
                        <td>${(q.execution_time || 0).toFixed(2)}s</td>
                        <td>${q.execution_count || 1}</td>
                        <td>${(q.avg_time || 0).toFixed(2)}s</td>
                        <td>${(q.rows_examined || 0).toLocaleString()}</td>
                    </tr>`;
                }).join('');

            } catch (err) {
                showError(err.message);
            } finally {
                showLoading(false);
            }
        }

        document.addEventListener('DOMContentLoaded', loadSlowQueries);
    </script>
</body>
</html>
