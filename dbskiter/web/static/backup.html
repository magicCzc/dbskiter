<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>备份管理 - DBSKiter</title>
    <link rel="stylesheet" href="/ui/css/style.css">
</head>
<body>
    <nav>
        <a href="/ui/" class="logo">DBSKiter</a>
        <a href="/ui/">仪表盘</a>
        <a href="/ui/slow-queries.html">慢查询</a>
        <a href="/ui/security.html">安全审计</a>
        <a href="/ui/backup.html" class="active">备份管理</a>
        <a href="/ui/scheduler.html">任务调度</a>
    </nav>

    <div class="container">
        <div id="error" class="error"></div>
        <div id="loading" class="loading">加载中...</div>

        <!-- 创建备份 -->
        <div class="card">
            <h2>💾 创建备份</h2>
            <div class="toolbar">
                <label>数据库：</label>
                <input type="text" id="db-input" value="default" style="max-width:200px;">
                <label>类型：</label>
                <select id="backup-type">
                    <option value="full">全量备份</option>
                    <option value="table">表级备份</option>
                </select>
                <label>表名（可选）：</label>
                <input type="text" id="backup-tables" placeholder="users,orders" style="max-width:200px;">
                <button class="btn-primary" onclick="createBackup()">开始备份</button>
            </div>
            <div id="backup-result" style="display:none;margin-top:16px;padding:12px;border-radius:4px;" class="status"></div>
        </div>

        <!-- 备份列表 -->
        <div class="card">
            <h2>备份记录</h2>
            <table>
                <thead>
                    <tr><th>备份 ID</th><th>类型</th><th>文件路径</th><th>大小</th><th>状态</th></tr>
                </thead>
                <tbody id="backups-table"></tbody>
            </table>
        </div>
    </div>

    <footer>DBSKiter v3.0.43 &middot; 数据库 AIOps 运维助手</footer>

    <script>
        async function createBackup() {
            const db = document.getElementById('db-input').value || 'default';
            const type = document.getElementById('backup-type').value;
            const tables = document.getElementById('backup-tables').value;
            const resultDiv = document.getElementById('backup-result');
            resultDiv.style.display = 'block';

            try {
                let url = `/backup?database=${encodeURIComponent(db)}&backup_type=${type}`;
                if (tables) url += `&tables=${encodeURIComponent(tables)}`;

                const data = await apiFetch(url, { method: 'POST' });
                if (data.success) {
                    resultDiv.className = 'status status-healthy';
                    resultDiv.innerHTML = `<strong>备份成功！</strong><br>
                        备份 ID: ${data.backup_id}<br>
                        文件路径: ${data.file_path}<br>
                        文件大小: ${formatBytes(data.file_size)}`;
                } else {
                    resultDiv.className = 'status status-critical';
                    resultDiv.innerHTML = `<strong>备份失败：</strong> ${escapeHtml(data.error || '未知错误')}`;
                }
                // 刷新备份列表
                loadBackups();
            } catch (err) {
                resultDiv.className = 'status status-critical';
                resultDiv.innerHTML = `<strong>错误：</strong> ${escapeHtml(err.message)}`;
            }
        }

        async function loadBackups() {
            const db = document.getElementById('db-input').value || 'default';
            showLoading(true);

            try {
                const data = await apiFetch(`/backups?database=${encodeURIComponent(db)}`);
                const backups = data.data?.backups || data.backups || [];
                const tbody = document.getElementById('backups-table');

                if (backups.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#64748b;">暂无备份记录</td></tr>';
                    return;
                }

                tbody.innerHTML = backups.map(b => {
                    const status = b.success ? 'success' : (b.error ? 'failed' : 'unknown');
                    return `<tr>
                        <td><code>${escapeHtml(b.backup_id || b.id || '-')}</code></td>
                        <td>${escapeHtml(b.backup_type || b.type || 'full')}</td>
                        <td>${escapeHtml(b.file_path || '-')}</td>
                        <td>${formatBytes(b.file_size || 0)}</td>
                        <td><span class="badge badge-${status === 'success' ? 'low' : 'critical'}">${status}</span></td>
                    </tr>`;
                }).join('');

            } catch (err) {
                // 静默处理（列表可能为空）
                document.getElementById('backups-table').innerHTML =
                    '<tr><td colspan="5" style="text-align:center;color:#64748b;">加载失败</td></tr>';
            } finally {
                showLoading(false);
            }
        }

        document.addEventListener('DOMContentLoaded', loadBackups);
    </script>
</body>
</html>
