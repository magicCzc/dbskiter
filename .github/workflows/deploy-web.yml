name: Deploy Web UI Demo

on:
  push:
    branches: [main]
    paths:
      - 'dbskiter/webui/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: dbskiter/webui
        run: npm install --no-audit --no-fund

      - name: Build Vue (Demo Mode)
        working-directory: dbskiter/webui
        run: VITE_DEMO_MODE=true npm run build

      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-tmp
          fetch-depth: 1

      - name: Deploy to gh-pages branch
        run: |
          set -e
          # 复制构建产物到 ui/ 子目录（保留 mkdocs 内容）
          mkdir -p gh-pages-tmp/ui
          cp -r dbskiter/web/static/* gh-pages-tmp/ui/
          touch gh-pages-tmp/.nojekyll

          cd gh-pages-tmp
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --cached --quiet; then
            echo "No changes to deploy"
            exit 0
          fi
          git commit -m "Deploy Web UI demo"
          git push
