name: Deploy Web UI Demo

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dbskiter/webui/package-lock.json

      - name: Install dependencies
        run: |
          cd dbskiter/webui
          npm ci

      - name: Build Vue (Demo Mode)
        run: |
          cd dbskiter/webui
          VITE_DEMO_MODE=true npm run build
        env:
          VITE_DEMO_MODE: 'true'

      - name: Deploy to gh-pages/ui/
        run: |
          # 配置 git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 获取 gh-pages 分支
          git fetch origin gh-pages
          git checkout gh-pages

          # 复制构建产物到 ui/ 子目录
          mkdir -p ui
          cp -r dbskiter/web/static/* ui/
          touch .nojekyll

          # 提交并推送
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to deploy"
            exit 0
          fi
          git commit -m "Deploy Web UI demo $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          git push origin gh-pages