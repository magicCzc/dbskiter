name: Deploy Web UI Demo

on:
  push:
    branches: [main]
    # 仅当 webui/ 目录或 workflow 文件变化时触发
    paths:
      - 'dbskiter/webui/**'
      - '.github/workflows/deploy-web.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dbskiter/webui/package-lock.json

      - name: Install dependencies
        run: |
          cd dbskiter/webui
          npm ci

      - name: Build Vue (Demo Mode)
        run: |
          cd dbskiter/webui
          VITE_DEMO_MODE=true npm run build
        env:
          VITE_DEMO_MODE: 'true'

      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Copy build output to gh-pages/ui/
        run: |
          # 确保目标目录存在
          mkdir -p gh-pages/ui
          # 复制所有构建产物（排除 mkdocs 原有的文件）
          cp -r dbskiter/web/static/* gh-pages/ui/
          # 添加 .nojekyll 标记（如果不存在）
          touch gh-pages/.nojekyll
          # 创建重定向：从根目录 301 到 ui/
          echo '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0; url=/dbskiter/ui/"></head><body><p>Redirecting to <a href="/dbskiter/ui/">Web UI Demo</a>...</p></body></html>' > gh-pages/demo.html

      - name: Commit and push
        run: |
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          # 检查是否有变更
          if git diff --cached --quiet; then
            echo "No changes to deploy"
            exit 0
          fi
          git commit -m "Deploy Web UI demo $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          git push origin gh-pages