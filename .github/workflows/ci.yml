name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── 快速反馈：Lint + 文档一致性 ───────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black

      - name: Check code style (black)
        run: black --check --diff --line-length=120 dbskiter/

      - name: Check code style (flake8)
        run: flake8 --config=.flake8 dbskiter/

      - name: Check doc consistency
        run: python scripts/check_doc_consistency.py

  # ─── 单元测试 + 覆盖率 ────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "."
          pip install pytest pytest-cov
          echo "=== Install complete ==="
          python -c "import dbskiter; print('dbskiter version:', dbskiter.__version__)"

      - name: Run tests with coverage
        run: PYTHONPATH=tests:tests/unit python -m pytest tests/ --cov=dbskiter --cov-report=term-missing --cov-fail-under=25 -v --tb=short

      - name: Run doc consistency check
        run: python scripts/check_doc_consistency.py

  # ─── 安全扫描 ─────────────────────────────────────────────────
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit

      - name: Run bandit (SAST)
        run: bandit -r dbskiter/ --skip=B101,B311 -f sarif -o bandit-results.sarif || true

      - name: Run pip-audit (dependency scan)
        run: pip-audit || true

  # ─── 文档构建 ─────────────────────────────────────────────────
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs mkdocs-material

      - name: Build docs
        run: mkdocs build --strict

  # ─── 性能基准 ─────────────────────────────────────────────────
  benchmark:
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "."
          pip install pytest

      - name: Run benchmarks
        run: python -m pytest tests/test_benchmarks.py -v -m benchmark --benchmark-json=benchmark.json

  # ─── 集成测试 ─────────────────────────────────────────────────
  integration:
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "."
          pip install pytest

      - name: Run integration tests
        run: python -m pytest tests/integration/ -v -m integration || echo "Integration tests may require Docker"

  # ─── 发布到 PyPI ──────────────────────────────────────────────
  publish:
    runs-on: ubuntu-latest
    needs: [lint, test, security, docs]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: python -m pip install build twine

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}